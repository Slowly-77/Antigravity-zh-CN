page.style.width='350px';await wait();check('narrow layout fits',page.scrollWidth<=page.clientWidth+1);check('narrow media stays above text',rect(media).bottom<=rect(text).top);page.style.width='';document.documentElement.classList.add('dark');await wait();check('dark surface',style(page).backgroundColor==='rgb(33, 33, 33)');check('dark bubble',style(text).backgroundColor==='rgb(48, 48, 48)');document.documentElement.classList.remove('dark');

check('standalone body matches normal typography',style(response.firstElementChild).fontSize==='14px'&&style(response.firstElementChild).lineHeight==='22px');
check('reply horizontal rules hidden without space',style(hr).display==='none'&&rect(hr).height===0);

check('nested thinking has no duplicate separator',header.querySelectorAll('.ag-worked-section').length===0);
