<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="fixture.css"><style>body{margin:0;padding:24px;background:white;color:#222;font-family:Arial}main{max-width:900px;margin:auto}.probe{margin-bottom:24px}.native-card{position:relative;display:flex;flex-direction:row}.native-actions{position:absolute;bottom:2px;right:2px}.native-content{max-height:10vh;overflow:hidden;white-space:pre-wrap}button{padding:4px}.reply{padding:20px 0}.dark{background:#18181b;color:#eee}</style><link rel="stylesheet" href="../src/chat-layout.css"><main id="fixtures"></main><pre id="result"></pre><script src="../src/chat-layout.js"></script><script src="../src/context-meter.js"></script><script>


const make=(id,value)=>`<div role="article" class="sticky top-0 probe"><div class="md-sticky-message-bleed"><div data-testid="user-input-step" id="${id}" class="flex flex-col w-full gap-2 group/user-input-step pt-4"><div class="relative p-px rounded-xl bg-card-border"><div class="bg-card native-card"><div class="flex-1 max-h-[10vh] native-content" style="mask-image:linear-gradient(black,transparent)">${value}</div><div class="user-input-buttons-container bg-card native-actions"><span>21:53</span><button class="copy">复制</button><button class="undo">撤销</button></div></div></div></div></div></div>`;
const long=Array.from({length:38},(_,i)=>`第 ${i+1} 行：这是一段用于验证长消息排版的示例内容，正文应完整保留，折叠按钮不能盖住文字。`).join('\n');
fixtures.innerHTML=make('long',long)+`<div class="reply">助手回复区域：应该与上一条消息保持间距。</div>`+make('short','你好')+make('path','https://example.test/'+('very-long-path/'.repeat(35)))+make('media','<img alt="附件示例" width="100" height="50"><button>附件操作</button>');
let nativeClicks=0,copyClicks=0;document.querySelectorAll('.native-content').forEach(n=>n.onclick=()=>nativeClicks++);document.querySelector('.copy').onclick=()=>copyClicks++;
installChatLayout();
const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,40))));
(async()=>{let passed=[];const check=(name,condition)=>{if(!condition)throw Error(name);passed.push(name)};
await wait();const step=document.querySelector('#long'),body=step.querySelector('.ag-message-content'),button=step.querySelector('.ag-message-toggle'),actions=step.querySelector('.ag-message-actions');
function separated(){return actions.getBoundingClientRect().top>=body.getBoundingClientRect().bottom && button.getBoundingClientRect().top>=body.getBoundingClientRect().bottom;}
check('long message collapsed',body.clientHeight<=225 && !button.hidden && button.getAttribute('aria-expanded')==='false');check('collapsed actions below text',separated());check('no fade mask',getComputedStyle(body).maskImage==='none');
button.click();await wait();check('expand shows full text',body.clientHeight>500 && body.scrollHeight<=body.clientHeight+2);check('expanded actions below text',separated());check('expand starts at first line',body.scrollTop===0);check('collapse label',button.textContent==='收起');
button.click();await wait();check('collapse restores limit',body.clientHeight<=225);check('no native click-to-scroll',nativeClicks===0);body.click();await wait();check('clicking text does not trigger native expansion',nativeClicks===0);
step.querySelector('.copy').click();check('copy handler preserved',copyClicks===1);
body.className='flex-1 max-h-[10vh] native-content';await wait();check('React class replacement repaired',body.classList.contains('ag-message-content'));check('one toggle after rerender',step.querySelectorAll('.ag-message-toggle').length===1);
check('short message has no fold button',document.querySelector('#short .ag-message-toggle').hidden);check('no horizontal overflow',document.documentElement.scrollWidth<=innerWidth);
for(const width of [620,360]){fixtures.style.width=width+'px';await wait();check('buttons separated at content width '+width,separated());check('no message overflow at '+width,step.getBoundingClientRect().right<=fixtures.getBoundingClientRect().right+1)}
fixtures.style.width='';document.documentElement.classList.add('dark');await wait();check('dark theme bubble',getComputedStyle(body).backgroundColor==='rgb(48, 48, 48)');document.documentElement.classList.remove('dark');
body.textContent='现在是一条短消息';await wait();check('dynamic content removes obsolete fold button',button.hidden);body.textContent=long;await wait();check('dynamic content restores fold button',!button.hidden);button.focus();button.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));check('toggle is real keyboard button',button.tagName==='BUTTON' && button.getAttribute('aria-controls')===body.id);
// Reproduce the native bottom-follow ResizeObserver while collapsing historical content.
const viewport=document.createElement('div');viewport.style.cssText='height:500px;overflow-y:auto;overflow-anchor:none;position:fixed;top:40px;left:0;width:800px;background:white;z-index:100';
const thread=document.createElement('div');thread.innerHTML='<div style="height:900px"></div>'+make('scroll-message',long.repeat(3))+'<div style="height:1200px">Last message</div>';viewport.append(thread);document.body.append(viewport);await wait();
const scrollStep=thread.querySelector('#scroll-message'),toggle=scrollStep.querySelector('.ag-message-toggle');toggle.click();await new Promise(r=>setTimeout(r,180));
viewport.scrollTop+=toggle.getBoundingClientRect().bottom-viewport.getBoundingClientRect().bottom+20;await wait();
let follow=true,oldTop=viewport.scrollTop,oldHeight=viewport.scrollHeight,armed=false,followCalls=0;
viewport.addEventListener('scroll',()=>{const top=viewport.scrollTop,shrinking=viewport.scrollHeight<oldHeight,atBottom=viewport.scrollHeight-viewport.clientHeight-top<=20;if(top<oldTop&&!shrinking)follow=false;else if(atBottom)follow=true;oldTop=top;oldHeight=viewport.scrollHeight});
const nativeResize=new ResizeObserver(()=>{if(armed&&follow){followCalls++;viewport.scrollTo({top:viewport.scrollHeight,behavior:'instant'})}});nativeResize.observe(thread);await wait();armed=true;
toggle.click();await new Promise(r=>setTimeout(r,250));
check('collapse stays at current message despite native follow',Math.abs(scrollStep.getBoundingClientRect().top-viewport.getBoundingClientRect().top-16)<3);
check('collapse does not end at last message',viewport.scrollHeight-viewport.scrollTop-viewport.clientHeight>600);
check('native bottom-follow conflict exercised',followCalls>0);check('manual reading exits native bottom follow',!follow);
thread.lastElementChild.style.height='1300px';await wait();check('later resize keeps reading position',Math.abs(scrollStep.getBoundingClientRect().top-viewport.getBoundingClientRect().top-16)<3);
const topBefore=scrollStep.getBoundingClientRect().top;toggle.click();await new Promise(r=>setTimeout(r,160));check('expand preserves message top',Math.abs(scrollStep.getBoundingClientRect().top-topBefore)<3);
toggle.click();window.dispatchEvent(new WheelEvent('wheel'));viewport.scrollTop+=180;const userTop=viewport.scrollTop;await new Promise(r=>setTimeout(r,180));check('user scroll cancels restoration',Math.abs(viewport.scrollTop-userTop)<2);
nativeResize.disconnect();viewport.remove();
const splitHost=document.createElement('div');splitHost.style.cssText='width:700px;margin:auto';splitHost.innerHTML=make('split','<div class="relative flex flex-wrap gap-2 mb-2"><button><img width="64" height="64" alt="附件一"></button><button><img width="64" height="64" alt="附件二"></button></div><div class="whitespace-pre-wrap text-sm">图片与文字分开</div>');document.body.append(splitHost);await wait();
const split=splitHost.querySelector('#split'),mediaRow=split.querySelector('.ag-message-media'),textBubble=split.querySelector('.ag-message-text'),splitBody=split.querySelector('.ag-message-content');
check('images outside text bubble',getComputedStyle(splitBody).backgroundColor==='rgba(0, 0, 0, 0)'&&getComputedStyle(textBubble).backgroundColor!=='rgba(0, 0, 0, 0)');check('images above text with spacing',mediaRow.getBoundingClientRect().bottom+9<=textBubble.getBoundingClientRect().top);check('two thumbnails on same row',mediaRow.querySelectorAll('img')[0].getBoundingClientRect().top===mediaRow.querySelectorAll('img')[1].getBoundingClientRect().top);
textBubble.textContent=long;await wait();check('image message folds text only ('+textBubble.clientHeight+','+mediaRow.clientHeight+')',textBubble.clientHeight<=225&&mediaRow.clientHeight>=100);split.querySelector('.ag-message-toggle').click();await wait();check('image message expands all text',textBubble.clientHeight>500);check('media preserved after fold toggle',mediaRow.querySelectorAll('button').length===2);mediaRow.remove();await wait();check('removed attachments restore plain text bubble',!textBubble.classList.contains('ag-message-text')&&!splitBody.classList.contains('ag-message-separated'));splitHost.remove();
result.textContent=JSON.stringify({ok:true,count:passed.length,passed},null,2);document.title='PASS '+passed.length;
})().catch(e=>{result.textContent=JSON.stringify({ok:false,error:e.message});document.title='FAIL '+e.message});
</script>
